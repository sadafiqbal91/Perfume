<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore the ZEU men’s and women’s fragrance collections — luxury scents designed for signature style and memorable presence." />
  <meta name="keywords" content="luxury perfume collection, ZEU fragrances, signature scent, men’s perfume, women’s perfume" />
  <meta property="og:title" content="ZEU Perfume Collections | ZEU Perfumes" />
  <meta property="og:description" content="Discover ZEU’s luxury men’s and women’s collections, styled for signature elegance and unforgettable moments." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="images/eaa8acd2-31e8-4e84-a4ca-cf23f2d3b543.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>ZEU Perfume Collections | ZEU Perfumes</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, rgba(184,138,68,0.16), transparent 24%),
                  linear-gradient(135deg, #09090f 0%, #12131a 100%);
      color: #f7efe6;
      font-family: 'Inter', sans-serif;
    }

    .detail-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.2rem 3rem;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
      padding: 0.8rem 1rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #f7efe6;
      text-decoration: none;
      transition: transform 0.2s ease;
    }

    .back-btn:hover {
      transform: translateX(-3px);
    }

    .detail-card {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 1.6rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1.5rem;
      padding: 1.4rem;
      box-shadow: 0 24px 60px rgba(0,0,0,0.2);
    }

    .detail-image {
      width: 100%;
      min-height: 420px;
      border-radius: 1.2rem;
      overflow: hidden;
      background: rgba(255,255,255,0.03);
      display: grid;
      place-items: center;
    }

    .detail-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      padding: 0;
    }

    .detail-content h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      margin-bottom: 0.6rem;
    }

    .detail-content .eyebrow {
      color: #d8af6f;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      font-size: 0.8rem;
      margin-bottom: 0.8rem;
    }

    .detail-content p {
      color: #b8af9f;
      margin-bottom: 1rem;
      line-height: 1.75;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #e5c48c;
      margin-bottom: 0.4rem;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0.85rem 1.2rem;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn-primary {
      background: linear-gradient(135deg, #d8af6f, #b88a44);
      color: #111;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: #f7efe6;
    }

    .collection-box {
      margin-top: 1.2rem;
      padding: 1rem;
      border-radius: 1rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .collection-toggle {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }

    .collection-toggle .btn {
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
    }

    .collection-toggle .btn.active {
      background: linear-gradient(135deg, #e5c48c, #d8af6f);
      color: #111;
    }

    .search-box {
      margin-top: 0.8rem;
      margin-bottom: 0.9rem;
    }

    .search-box input {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 0.9rem;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: #f7efe6;
    }

    .search-box input::placeholder {
      color: rgba(247,239,230,0.58);
    }

    .list-box {
      max-height: 320px;
      overflow-y: auto;
      padding: 0.8rem;
      border-radius: 0.9rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .list-box ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 0.45rem;
    }

    .list-box li {
      padding: 0.8rem 1rem;
      border-radius: 1rem;
      background: rgba(255,255,255,0.05);
      color: #f7efe6;
      font-size: 0.95rem;
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
    }

    .list-box li:hover {
      transform: scale(1.02);
      box-shadow: 0 0 16px rgba(184, 138, 68, 0.42);
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 214, 115, 0.65);
    }

    .list-box li.selected {
      background: rgba(184, 138, 68, 0.18);
      border-color: rgba(255, 214, 115, 0.45);
      color: #f7efe6;
    }

    .list-box.closed {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
      transition: max-height 0.25s ease, opacity 0.25s ease;
    }

    @keyframes floatHover {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1.02); }
    }

    .list-box li:hover {
      animation: floatHover 0.45s ease;
    }

    .list-box[data-view="luxury"] .signature-list,
    .list-box[data-view="luxury"] .rare-list,
    .list-box[data-view="signature"] .luxury-list,
    .list-box[data-view="signature"] .rare-list,
    .list-box[data-view="rare"] .luxury-list,
    .list-box[data-view="rare"] .signature-list {
      display: none;
    }

    @media (max-width: 800px) {
      .detail-card { grid-template-columns: 1fr; }
      .detail-image { min-height: 320px; }
    }
  </style>
</head>
<body>
  <div class="detail-page">
    <a href="index.html" class="back-btn">← Back to collection</a>

    <div class="detail-card">
      <div class="detail-image">
        <img src="images/eaa8acd2-31e8-4e84-a4ca-cf23f2d3b543.png" alt="ZEU men's signature fragrance bottle" />
      </div>
      <div class="detail-content">
        <p class="eyebrow">Signature fragrance</p>
        <div class="brand-title">ZEU MEN'S COLLECTION</div>
        <h1>Men’s Signature Selection</h1>

        <div class="btn-row">
          <a href="#luxuryCollection" class="btn btn-primary">Luxury Collection</a>
          <button class="btn btn-secondary" id="bookBtn" type="button">Reserve this scent</button>
        </div>

        <div class="collection-box" id="luxuryCollection">
          <div class="collection-toggle">
            <button class="btn btn-primary active" data-view="signature">Signature Collection</button>
            <button class="btn btn-secondary" data-view="rare">Rare Collection</button>
          </div>

          <div class="search-box">
            <input type="search" id="fragranceSearch" placeholder="Search fragrances..." aria-label="Search fragrances" />
          </div>

          <div class="list-box" data-view="signature">
            <ul class="signature-list"></ul>
            <ul class="rare-list"></ul>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="modal-overlay" id="bookingModal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="bookingTitle">
      <button class="modal-close" type="button" id="closeModal" aria-label="Close booking form">×</button>
      <h2 id="bookingTitle">Book your signature scent</h2>
      <p>Reserve your signature scent now with a private booking request.</p>
      <form class="booking-form" id="bookingForm">
        <label>
          Name
          <input type="text" name="name" placeholder="Your name" required>
        </label>
        <label>
          Email
          <input type="email" name="email" placeholder="you@example.com" required>
        </label>
        <label>
          Product
          <input type="text" name="product" id="bookingProduct" placeholder="Selected fragrance" value="Men’s Signature Selection" required>
        </label>
        <label>
          Message
          <textarea name="message" rows="4" placeholder="Tell us what you love..." required></textarea>
        </label>
        <button type="submit" class="btn btn-primary">Submit booking</button>
      </form>
    </div>
  </div>

  <script src="products.js"></script>
  <script src="script.js"></script>
  <script>
    document.querySelectorAll('.collection-box').forEach(box => {
      const searchInput = box.querySelector('.search-box input');
      const listBox = box.querySelector('.list-box');
      const toggleButtons = box.querySelectorAll('.collection-toggle .btn');

      perfumeProducts.forEach(product => {
        const list = listBox.querySelector(`.${product.category}-list`);
        if (product.collection !== 'men' || !list) return;

        const item = document.createElement('li');
        item.textContent = product.name;
        list.appendChild(item);
      });

      const allItems = Array.from(listBox.querySelectorAll('li'));

      function filterItems() {
        const query = searchInput.value.toLowerCase().trim();
        const view = listBox.dataset.view;

        allItems.forEach(item => {
          const list = item.closest('ul');
          const isVisibleList = list.classList.contains(`${view}-list`);
          const text = item.textContent.toLowerCase();
          const matchesQuery = text.includes(query);
          const isSelectedItem = selectedFragrance && item.textContent.trim() === selectedFragrance;
          const shouldShow = isVisibleList && (isSelectedItem || query === '' || matchesQuery);
          item.style.display = shouldShow ? 'block' : 'none';
        });
      }

      let selectedFragrance = '';

      function clearSelectedItems() {
        allItems.forEach(item => item.classList.remove('selected'));
      }

      const bookingProduct = document.getElementById('bookingProduct');

      function selectListItem(item) {
        clearSelectedItems();
        item.classList.add('selected');
        selectedFragrance = item.textContent.trim();
        searchInput.value = selectedFragrance;
        if (bookingProduct) bookingProduct.value = selectedFragrance;
        listBox.classList.add('closed');
      }

      searchInput.addEventListener('input', () => {
        selectedFragrance = '';
        filterItems();
      });
      searchInput.addEventListener('focus', () => listBox.classList.remove('closed'));

      toggleButtons.forEach(button => {
        button.addEventListener('click', () => {
          const view = button.dataset.view;
          listBox.dataset.view = view;

          toggleButtons.forEach(btn => {
            btn.classList.toggle('active', btn === button);
            btn.classList.toggle('btn-primary', btn === button);
            btn.classList.toggle('btn-secondary', btn !== button);
          });

          listBox.classList.remove('closed');
          filterItems();
        });
      });

      allItems.forEach(item => {
        item.addEventListener('click', () => selectListItem(item));
      });

      filterItems();
    });
  </script>
</body>
</html>
